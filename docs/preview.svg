<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <pattern id="icvDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c9d2e0"/>
    </pattern>
    <linearGradient id="icvPhotoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb6f0"/>
      <stop offset="1" stop-color="#4a6fd0"/>
    </linearGradient>
    <linearGradient id="icvPhotoB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c58a"/>
      <stop offset="1" stop-color="#d98a5a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#f7f9fc"/>
  <rect x="0" y="0" width="640" height="300" fill="url(#icvDots)"/>

  <!-- reference edge -->
  <path d="M188 148 C 236 148, 250 148, 292 148" stroke="#3f6fd8" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <circle cx="188" cy="148" r="4" fill="#3f6fd8"/>
  <circle cx="292" cy="148" r="4" fill="#fff" stroke="#3f6fd8" stroke-width="2"/>

  <!-- image card (left) -->
  <g>
    <rect x="52" y="86" width="136" height="152" rx="10" fill="#fff" stroke="#dfe5ef"/>
    <rect x="52" y="86" width="136" height="26" rx="10" fill="#eef2f9"/>
    <rect x="52" y="102" width="136" height="10" fill="#eef2f9"/>
    <circle cx="66" cy="99" r="3.4" fill="#3f6fd8"/>
    <rect x="76" y="95" width="42" height="7" rx="3.5" fill="#c3ccdb"/>
    <rect x="62" y="122" width="116" height="76" rx="6" fill="url(#icvPhotoA)"/>
    <circle cx="96" cy="150" r="12" fill="#f7f9fc" opacity="0.7"/>
    <path d="M62 198 L96 168 L126 190 L146 176 L178 198 Z" fill="#f7f9fc" opacity="0.45"/>
    <rect x="62" y="208" width="52" height="8" rx="4" fill="#dfe5ef"/>
    <rect x="120" y="208" width="30" height="8" rx="4" fill="#dfe5ef"/>
    <circle cx="166" cy="212" r="7" fill="#eef2f9" stroke="#dfe5ef"/>
  </g>

  <!-- generation card (right) -->
  <g>
    <rect x="292" y="60" width="200" height="228" rx="10" fill="#fff" stroke="#3f6fd8"/>
    <rect x="292" y="60" width="200" height="26" rx="10" fill="#eaf0fc"/>
    <rect x="292" y="76" width="200" height="10" fill="#eaf0fc"/>
    <circle cx="306" cy="73" r="3.4" fill="#3f6fd8"/>
    <rect x="316" y="69" width="46" height="8" rx="4" fill="#a7bde8"/>
    <circle cx="470" cy="73" r="5.5" fill="#f0f4fb" stroke="#c3ccdb"/>

    <rect x="304" y="96" width="176" height="38" rx="5" fill="#f4f6fa"/>
    <rect x="311" y="104" width="140" height="6" rx="3" fill="#c3ccdb"/>
    <rect x="311" y="116" width="104" height="6" rx="3" fill="#d7dde8"/>

    <rect x="304" y="142" width="56" height="16" rx="5" fill="#eef2f9" stroke="#dfe5ef"/>
    <rect x="310" y="147" width="30" height="6" rx="3" fill="#b9c4d6"/>
    <rect x="366" y="142" width="34" height="16" rx="5" fill="#eef2f9" stroke="#dfe5ef"/>
    <rect x="372" y="147" width="16" height="6" rx="3" fill="#b9c4d6"/>

    <rect x="304" y="166" width="176" height="74" rx="6" fill="url(#icvPhotoB)"/>
    <circle cx="352" cy="196" r="13" fill="#fdf6ee" opacity="0.75"/>
    <path d="M304 240 L344 208 L378 232 L404 214 L480 240 Z" fill="#fdf6ee" opacity="0.4"/>

    <rect x="304" y="250" width="74" height="22" rx="6" fill="#3f6fd8"/>
    <rect x="318" y="257" width="34" height="7" rx="3.5" fill="#fff" opacity="0.92"/>
    <circle cx="456" cy="261" r="10" fill="#eef2f9" stroke="#dfe5ef"/>
    <circle cx="474" cy="261" r="10" fill="#eef2f9" stroke="#dfe5ef"/>
  </g>

  <!-- third card stub, partially off-frame to suggest an endless board -->
  <g opacity="0.55">
    <rect x="528" y="126" width="150" height="120" rx="10" fill="#fff" stroke="#dfe5ef"/>
    <rect x="528" y="126" width="150" height="24" rx="10" fill="#eef2f9"/>
    <rect x="528" y="140" width="150" height="10" fill="#eef2f9"/>
    <rect x="538" y="162" width="130" height="46" rx="6" fill="#e6ebf3"/>
    <rect x="538" y="216" width="88" height="7" rx="3.5" fill="#dfe5ef"/>
  </g>
</svg>
